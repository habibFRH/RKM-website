<svg width="400" height="340" viewBox="0 0 180 160" xmlns="http://www.w3.org/2000/svg">
<style>
@keyframes dotDrift{0%{transform:translate(0,0);opacity:.15}30%{transform:translate(3px,-2px);opacity:.2}60%{transform:translate(-2px,3px);opacity:.15}100%{transform:translate(0,0);opacity:.15}}
@keyframes gridFadeIn{0%{opacity:0;transform:scale(.9)}100%{opacity:.85;transform:scale(1)}}
@keyframes gridNodePop{0%{r:0;opacity:0}100%{r:2.5;opacity:1}}
@keyframes arrowSlide{0%{opacity:0;transform:translateX(-10px)}100%{opacity:.35;transform:translateX(0)}}
.sd{animation:dotDrift 3s ease-in-out infinite}
.sd:nth-child(2n){animation-delay:.5s}
.sd:nth-child(3n){animation-delay:1s}
.sg{opacity:0;animation:gridFadeIn 1s ease-out forwards .8s}
.sn{animation:gridNodePop .4s ease-out forwards}
.sn1{animation-delay:1.2s}.sn2{animation-delay:1.4s}.sn3{animation-delay:1.6s}
.sn4{animation-delay:1.8s}.sn5{animation-delay:2s}.sn6{animation-delay:2.2s}
.sa{opacity:0;animation:arrowSlide .6s ease-out forwards .6s}
</style>
<g fill="#030F60" opacity=".2">
<circle cx="15" cy="35" r="1.5" class="sd"/><circle cx="22" cy="50" r="1.2" class="sd"/><circle cx="10" cy="65" r="1.5" class="sd"/>
<circle cx="28" cy="30" r="1" class="sd"/><circle cx="18" cy="80" r="1.3" class="sd"/><circle cx="35" cy="55" r="1.2" class="sd"/>
<circle cx="12" cy="95" r="1.1" class="sd"/><circle cx="30" cy="75" r="1.4" class="sd"/><circle cx="25" cy="100" r="1.2" class="sd"/>
<circle cx="40" cy="40" r=".9" class="sd"/><circle cx="38" cy="90" r="1.3" class="sd"/><circle cx="42" cy="70" r="1.1" class="sd"/>
<circle cx="50" cy="45" r="1.2" class="sd"/><circle cx="48" cy="60" r="1" class="sd"/><circle cx="55" cy="85" r="1.4" class="sd"/>
<circle cx="20" cy="110" r="1" class="sd"/><circle cx="45" cy="105" r="1.1" class="sd"/><circle cx="33" cy="120" r=".9" class="sd"/>
</g>
<g fill="#030F60" opacity=".45">
<circle cx="68" cy="40" r="1.8" class="sd"/><circle cx="73" cy="60" r="1.5" class="sd"/><circle cx="70" cy="80" r="1.6" class="sd"/>
<circle cx="78" cy="50" r="1.4" class="sd"/><circle cx="75" cy="95" r="1.3" class="sd"/><circle cx="80" cy="70" r="1.5" class="sd"/>
</g>
<g stroke="#030F60" stroke-width=".8" fill="none" class="sg">
<rect x="100" y="35" width="22" height="28" rx="1"/><rect x="128" y="35" width="22" height="28" rx="1"/>
<rect x="100" y="68" width="22" height="28" rx="1"/><rect x="128" y="68" width="22" height="28" rx="1"/>
<rect x="100" y="101" width="22" height="28" rx="1"/><rect x="128" y="101" width="22" height="28" rx="1"/>
</g>
<g fill="#030F60">
<circle cx="111" cy="49" r="0" class="sn sn1"/><circle cx="139" cy="49" r="0" class="sn sn2"/>
<circle cx="111" cy="82" r="0" class="sn sn3"/><circle cx="139" cy="82" r="0" class="sn sn4"/>
<circle cx="111" cy="115" r="0" class="sn sn5"/><circle cx="139" cy="115" r="0" class="sn sn6"/>
</g>
<g class="sa"><line x1="60" y1="78" x2="90" y2="78" stroke="#030F60" stroke-width="1"/><polygon points="90,75 96,78 90,81" fill="#030F60"/></g>
</svg>