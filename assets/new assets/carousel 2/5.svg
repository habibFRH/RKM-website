<svg width="400" height="340" viewBox="0 0 180 160" xmlns="http://www.w3.org/2000/svg">
<style>
@keyframes cDraw{0%{stroke-dashoffset:400}100%{stroke-dashoffset:0}}
@keyframes cPop{0%{r:0;opacity:0}100%{r:4;opacity:.8}}
.cc{stroke-dasharray:400;stroke-dashoffset:400}
.c1{animation:cDraw 2s ease-out forwards 0s}
.c2{animation:cDraw 2s ease-out forwards .1s}
.c3{animation:cDraw 2s ease-out forwards .2s}
.c4{animation:cDraw 2s ease-out forwards .3s}
.c5{animation:cDraw 2s ease-out forwards .4s}
.c6{animation:cDraw 2s ease-out forwards .5s}
.c7{animation:cDraw 2s ease-out forwards .6s}
.c8{animation:cDraw 2s ease-out forwards .7s}
.c9{animation:cDraw 2s ease-out forwards .8s}
.c10{animation:cDraw 2s ease-out forwards .9s}
.c11{animation:cDraw 2s ease-out forwards 1s}
.cp{r:0;opacity:0;animation:cPop .4s ease-out forwards 1.5s}
.cd{stroke-dasharray:4,4;opacity:0;animation:cDraw .6s ease-out forwards 1.8s}
</style>
