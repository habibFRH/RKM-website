<circle cx="65" cy="45" class="cp" fill="#FE701D"/>
<circle cx="110" cy="55" class="cp" fill="#FE701D"/>
<line x1="65" y1="45" x2="110" y2="55" stroke="#FE701D" stroke-width=".5" class="cd" opacity=".35"/>
</svg>