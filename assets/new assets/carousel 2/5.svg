<path d="M10,100 Q57,37 102,63 Q147,100 170,65" stroke="#FE701D" fill="none" opacity=".3" stroke-width=".7" class="cc c7"/>
<path d="M10,95 Q59,39 104,61 Q149,95 170,70" stroke="#FE701D" fill="none" opacity=".35" stroke-width=".7" class="cc c8"/>
